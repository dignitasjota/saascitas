name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saascitas_test
          POSTGRES_USER: saascitas
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://saascitas:testpass@localhost:5432/saascitas_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Install the whole workspace tree from the root lockfile (no per-package
      # lockfiles exist in this hoisted monorepo).
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=backend

      - name: Run migrations
        run: npm run migrate:deploy --workspace=backend

      - name: Run unit tests
        run: npm test --workspace=backend -- --coverage --coverageReporters=lcov
        env:
          JWT_SECRET: test-secret-for-ci-only
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Type check
        run: npx tsc -p backend/tsconfig.build.json --noEmit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p frontend/tsconfig.json --noEmit

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
