name: Deploy

# Deploy only after the CI workflow (backend tests + frontend build) succeeds
# on main. This prevents shipping a commit whose tests or build are broken.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.FRONTEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        # Pinned by commit SHA (v1.2.5) — a mutable tag on a third-party action
        # that receives the deploy SSH key is a supply-chain risk.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /srv/saascitas

            # Pull latest compose / nginx files
            git pull origin main

            # Update image tag
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GITHUB_REPOSITORY=${{ github.repository }}

            # Pull new images
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Rolling restart of app containers
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend

            # Reload nginx in case its config changed in this pull
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            # Clean up old images
            docker image prune -f
